<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마법검의 조각 - 3번 방: 다이아몬드 폭포</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 픽셀 아트 폰트 및 한국어 레트로 폰트 (DungGeunMo) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.530/neodgm/style.css">
    <style>
        * {
            font-family: 'NeoDungGeunMo', 'DungGeunMo', monospace, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Pixel Border Utilities */
        .pixel-box {
            background-color: #1a1c2e;
            border: 4px solid #ffffff;
            box-shadow: 
                -4px 0 0 0 #000,
                4px 0 0 0 #000,
                0 -4px 0 0 #000,
                0 4px 0 0 #000,
                inset -4px -4px 0 0 #2d3250;
            image-rendering: pixelated;
        }

        .pixel-box-diamond {
            background-color: #0f172a;
            border: 4px solid #e0f2fe;
            box-shadow: 
                -4px 0 0 0 #38bdf8,
                4px 0 0 0 #38bdf8,
                0 -4px 0 0 #38bdf8,
                0 4px 0 0 #38bdf8,
                inset -4px -4px 0 0 #1e293b;
        }

        .pixel-paper {
            background-color: #f8fafc;
            color: #0f172a;
            border: 4px solid #e2e8f0;
            box-shadow: 
                -4px 0 0 0 #0284c7,
                4px 0 0 0 #0284c7,
                0 -4px 0 0 #0284c7,
                0 4px 0 0 #0284c7,
                inset -4px -4px 0 0 #cbd5e1;
            position: relative;
        }

        /* Diamond Border Deco for Note */
        .pixel-paper::before {
            content: "◆";
            position: absolute;
            top: 4px;
            left: 4px;
            color: #38bdf8;
            font-size: 14px;
        }
        .pixel-paper::after {
            content: "◆";
            position: absolute;
            top: 4px;
            right: 4px;
            color: #38bdf8;
            font-size: 14px;
        }

        .pixel-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: 3px solid #60a5fa;
            box-shadow: 0 4px 0 #1e40af;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e40af;
        }

        .pixel-btn-gold {
            background-color: #d97706;
            color: #ffffff;
            border: 3px solid #fcd34d;
            box-shadow: 0 4px 0 #92400e;
        }

        /* Custom Keyframe Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes sparkleGlitter {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #e0f2fe); }
        }

        @keyframes shakeHorizontal {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        .animate-sparkle {
            animation: sparkleGlitter 1.8s ease-in-out infinite;
        }

        .shake-effect {
            animation: shakeHorizontal 0.4s ease-in-out;
        }

        /* Scrollbar custom styling */
        .pixel-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .pixel-scroll::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .pixel-scroll::-webkit-scrollbar-thumb {
            background: #0284c7;
        }
    </style>
</head>
<body class="w-full h-screen flex flex-col justify-between items-center relative overflow-hidden bg-slate-950">

    <!-- Background Animated Pixel Waterfall & Ore Canvas -->
    <canvas id="bgCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

    <!-- TOP HUD BAR -->
    <header class="w-full max-w-md p-3 z-20 flex justify-between items-center">
        <!-- Room Info Badge -->
        <div class="pixel-box px-3 py-1 bg-slate-900/90 text-xs text-sky-200 flex items-center gap-1">
            <span class="text-sky-400">STAGE 3/4</span>
            <span class="text-slate-400">|</span>
            <span>다이아몬드 폭포</span>
        </div>

        <!-- Right Side: Health Hearts & Backpack -->
        <div class="flex items-center gap-2">
            <!-- Health Hearts -->
            <div id="heartsContainer" class="pixel-box px-2 py-1 bg-slate-900/90 flex gap-1 items-center">
                <svg class="heart-icon w-4 h-4 fill-red-500" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart-icon w-4 h-4 fill-red-500" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <svg class="heart-icon w-4 h-4 fill-red-500" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>

            <!-- Inventory Bag Button -->
            <button onclick="toggleInventoryModal()" class="pixel-box p-1.5 bg-amber-900/90 text-amber-200 hover:bg-amber-800 transition active:scale-95" title="가방 열기">
                <svg class="w-5 h-5 fill-amber-300" viewBox="0 0 24 24">
                    <path d="M20 7h-4V5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 5h4v2h-4V5zm10 15H4V9h16v11z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN INTERACTIVE FIELD AREA -->
    <main class="w-full max-w-md flex-1 relative flex flex-col justify-between items-center p-4 z-10">
        
        <!-- Story / Dialogue Window -->
        <div id="introDialogue" class="w-full pixel-box-diamond p-3.5 bg-slate-900/95 text-slate-100 text-sm leading-relaxed mb-auto animate-float">
            <div class="flex items-center gap-2 mb-1 text-sky-300 text-xs font-bold">
                <span>🛡️ 용사의 가이드</span>
            </div>
            <p id="dialogueText">
                다이아몬드 폭포에 도착했다. 전설의 다이아몬드 야생화를 발견했다. 마법검의 마법 참을 만들 다이아몬드를 채집하라.
            </p>
        </div>

        <!-- Interactive Diamond Wildflower Object on the waterfall field -->
        <div id="flowerContainer" class="my-auto relative cursor-pointer group flex flex-col items-center" onclick="openProblemModal()">
            <!-- Glow effect behind flower -->
            <div class="absolute -inset-4 bg-sky-300/20 rounded-full blur-md animate-pulse"></div>
            
            <!-- Pixel Flower SVG Rendering -->
            <div id="flowerIcon" class="relative z-10 w-28 h-28 animate-float animate-sparkle transform transition group-hover:scale-110">
                <!-- Dynamically rendered via JS -->
            </div>

            <!-- Hint Click Badge -->
            <div class="mt-3 pixel-box px-3 py-1 bg-sky-950/90 text-sky-200 text-xs border-sky-400 animate-bounce">
                ✨ [야생화 클릭] 쪽지 확인
            </div>
        </div>

        <!-- Toast Notification Area -->
        <div id="toastMessage" class="hidden w-full pixel-box p-3 bg-red-950 border-red-500 text-red-200 text-center text-xs font-bold mb-4 shadow-xl">
            <!-- Toast content -->
        </div>

    </main>

    <!-- PROBLEM NOTE MODAL (지문 쪽지 모달) -->
    <div id="problemModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-30 hidden flex justify-center items-center p-3">
        <div id="modalCard" class="w-full max-w-md max-h-[92vh] pixel-paper p-4 flex flex-col justify-between overflow-hidden relative">
            
            <!-- Close Button -->
            <button onclick="closeProblemModal()" class="absolute top-2 right-2 text-slate-500 hover:text-slate-900 font-bold px-2 text-sm z-10">
                ✖
            </button>

            <div class="overflow-y-auto pixel-scroll pr-1 my-2 text-slate-900 space-y-3">
                <!-- Modal Title / Question Prompt -->
                <div class="border-b-2 border-sky-300 pb-2">
                    <span class="inline-block bg-sky-600 text-white text-[11px] px-2 py-0.5 rounded-sm mb-1">영어 복습 퀴즈</span>
                    <h3 class="text-sm font-bold text-slate-900 leading-snug" id="questionPrompt">
                        <!-- Filled by JS -->
                    </h3>
                </div>

                <!-- Main English Passage (Strictly 16px+ for readability) -->
                <div class="bg-slate-100 p-3 rounded border border-slate-300 text-slate-800 text-[16px] leading-relaxed font-sans text-justify select-text">
                    <p id="passageText" class="whitespace-pre-line"></p>
                </div>

                <!-- MCQ Options (1-5) -->
                <div id="optionsContainer" class="space-y-2 pt-1 font-sans">
                    <!-- Dynamic rendering of options -->
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2 border-t border-slate-300">
                <button onclick="submitAnswer()" class="w-full pixel-btn py-2 text-sm font-bold text-center">
                    정답 확인하기
                </button>
            </div>
        </div>
    </div>

    <!-- SUCCESS / ITEM ACQUISITION MODAL -->
    <div id="successModal" class="fixed inset-0 bg-black/90 z-40 hidden flex flex-col justify-center items-center p-4">
        <div class="w-full max-w-md pixel-box-diamond p-5 bg-slate-900 text-center flex flex-col items-center relative space-y-4">
            
            <div class="text-sky-300 text-xs font-bold uppercase tracking-widest">Item Discovered!</div>
            <h2 class="text-xl font-bold text-white flex items-center gap-1">
                <span>전설의 다이아몬드 야생화</span>
            </h2>

            <!-- Big Glowing Flower Asset -->
            <div class="my-2 relative flex justify-center items-center">
                <div class="absolute inset-0 bg-sky-400/30 rounded-full blur-xl animate-pulse"></div>
                <div id="acquiredFlowerGraphic" class="w-36 h-36 relative z-10 animate-float">
                    <!-- Canvas/SVG Flower Insertion -->
                </div>
            </div>

            <!-- Status Message Area -->
            <div id="successStatusText" class="text-sm text-sky-100 leading-relaxed bg-slate-800/80 p-3 rounded w-full border border-sky-800">
                성공적으로 문제를 해결하여 정결한 마법 참 요소를 추출했습니다!
            </div>

            <!-- Explanation Accordion/Box -->
            <div class="w-full text-left bg-slate-950 p-3 rounded border border-slate-800 text-xs text-slate-300 max-h-32 overflow-y-auto pixel-scroll">
                <div class="font-bold text-sky-400 mb-1">📌 문제 해설</div>
                <div id="explanationText" class="leading-relaxed"></div>
            </div>

            <!-- Action Button Area -->
            <div class="w-full pt-2" id="actionButtonContainer">
                <button id="collectBtn" onclick="collectItemAction()" class="w-full pixel-btn-gold py-2.5 text-sm font-bold animate-pulse">
                    [수집하기]
                </button>
            </div>
        </div>
    </div>

    <!-- INVENTORY MODAL -->
    <div id="inventoryModal" class="fixed inset-0 bg-black/75 z-50 hidden flex justify-center items-center p-4">
        <div class="w-full max-w-sm pixel-box p-4 bg-slate-900 text-white space-y-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-sm font-bold text-amber-300">🎒 용사의 가방</h3>
                <button onclick="toggleInventoryModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div class="grid grid-cols-3 gap-2 py-2">
                <!-- Slot 1 (Previous) -->
                <div class="pixel-box h-16 bg-slate-800 flex items-center justify-center relative opacity-60">
                    <span class="text-xs text-slate-400">마법 루비</span>
                </div>
                <!-- Slot 2 (Previous) -->
                <div class="pixel-box h-16 bg-slate-800 flex items-center justify-center relative opacity-60">
                    <span class="text-xs text-slate-400">사파이어 깃</span>
                </div>
                <!-- Slot 3 (Current Room Item) -->
                <div id="bagSlot3" class="pixel-box h-16 bg-slate-800 border-sky-400 flex flex-col items-center justify-center relative p-1">
                    <span class="text-[10px] text-slate-500">비어있음</span>
                </div>
            </div>

            <p class="text-xs text-slate-400 text-center">4개의 요소를 모두 모아야 마법검을 완성할 수 있습니다.</p>
        </div>
    </div>

    <script>
        /*
         * GAME DATA ENCRYPTION & DECRYPTION HELPERS
         * Sensitive items (correct answer index and floral icon payload) are encoded to meet security specs.
         */
        
        // Encoded Answer: '2' encoded in Base64 is "Mg=="
        const _encAns = "Mg=="; 

        // Encoded Question Data payload (To preserve exact user string without modification)
        const _encData = {
            prompt: "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",
            passage: `Weber's law concerns the perception of difference between two stimuli. It suggests that we might not be able to detect a 1-mm difference when we are looking at lines 466 mm and 467 mm in length, but we may be able to detect a 1-mm difference when we are comparing a line 2 mm long with one 3 mm long. Another example of this principle is that we can detect 1 candle when it is lit in an otherwise dark room. But when 1 candle is lit in a room in which 100 candles are already burning, we may not notice the light from this candle. Therefore, the Just-noticeable difference (JND) varies as a function of the strength of the signals. For example, the JND is greater for very loud noises than it is for much more quiet sounds. When a sound is very weak, we can tell that another sound is louder, even if it is barely louder. When a sound is very loud, to tell that another sound is even louder, it has to be much louder. Thus, Weber's law means that it is harder to distinguish between two samples when those samples are larger or stronger levels of the stimuli. \n\n{Weber’s law suggests that the just-noticeable difference (JND) and our ability to detect differences are contingent upon the intensity of the stimuli. This implies that the just-noticeable difference (A) and our ability to detect differences (B) when the intensity of the stimuli diminishes.}`,
            options: [
                "① (A) dwindles   (B) vanishes",
                "② (A) dwindles   (B) expands",
                "③ (A) dims          (B) vanishes",
                "④ (A) increases   (B) expands",
                "⑤ (A) increases   (B) declines"
            ],
            explanation: "자극의 세기가 감소하면, 두 자극의 차이를 알아차리기 위해 필요한 최소 차이인 최소식별차이(JND)도 작아진다. 즉 JND는  dwindles 에 해당한다. 또한 자극이 약할수록 더 작은 차이도 감지할 수 있으므로, 차이를 감지하는 능력은 커진다. 따라서  expands 가 적절하다."
        };

        // State variables
        let lives = 3;
        let selectedOption = null;
        let isCollected = false;

        function getDiamondFlowerSVG() {
            return `
            <svg viewBox="0 0 100 100" class="w-full h-full filter drop-shadow-[0_0_12px_rgba(56,189,248,0.8)]">
                <!-- Stalk & Leaves -->
                <path d="M 50 60 L 50 90" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
                <path d="M 50 75 Q 35 70 30 80 Q 45 85 50 75" fill="#38bdf8"/>
                <path d="M 50 70 Q 65 65 70 75 Q 55 80 50 70" fill="#38bdf8"/>

                <!-- Diamond Petals (Pixel Crystal geometry) -->
                <polygon points="50,15 62,35 50,42 38,35" fill="#f0f9ff"/>
                <polygon points="50,42 62,35 68,55 50,48" fill="#bae6fd"/>
                <polygon points="50,42 38,35 32,55 50,48" fill="#7dd3fc"/>
                <polygon points="50,15 38,35 22,25 35,12" fill="#e0f2fe"/>
                <polygon points="50,15 62,35 78,25 65,12" fill="#e0f2fe"/>
                <polygon points="50,48 68,55 50,75 32,55" fill="#38bdf8"/>

                <!-- Glowing Center Core -->
                <polygon points="50,30 57,40 50,50 43,40" fill="#ffffff"/>
                <circle cx="50" cy="40" r="3" fill="#38bdf8" class="animate-ping"/>
            </svg>
            `;
        }

        function initWaterfallCanvas() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // Particles for waterfall and glowing diamonds on cave wall
            const particles = [];
            const diamonds = [];

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: 3 + Math.random() * 5,
                    length: 8 + Math.random() * 16,
                    width: 2 + Math.random() * 3,
                    opacity: 0.4 + Math.random() * 0.6
                });
            }

            for (let i = 0; i < 25; i++) {
                diamonds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: 3 + Math.random() * 4,
                    alpha: Math.random(),
                    speed: 0.02 + Math.random() * 0.03
                });
            }

            function draw() {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw cave background diamond ores shining
                diamonds.forEach(d => {
                    d.alpha += d.speed;
                    if (d.alpha > 1 || d.alpha < 0) d.speed = -d.speed;
                    ctx.fillStyle = `rgba(224, 242, 254, ${Math.abs(d.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Waterfall Vertical Streams
                ctx.fillStyle = 'rgba(56, 189, 248, 0.7)';
                particles.forEach(p => {
                    ctx.fillRect(p.x, p.y, p.width, p.length);
                    p.y += p.speed;
                    if (p.y > canvas.height) {
                        p.y = -p.length;
                        p.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(draw);
            }
            draw();
        }

        function openProblemModal() {
            if (isCollected) return;
            document.getElementById('problemModal').classList.remove('hidden');
        }

        function closeProblemModal() {
            document.getElementById('problemModal').classList.add('hidden');
        }

        function toggleInventoryModal() {
            const inv = document.getElementById('inventoryModal');
            inv.classList.toggle('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function selectOption(index) {
            selectedOption = index;
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                if (idx === index) {
                    btn.classList.add('border-sky-500', 'bg-sky-100', 'font-bold');
                    btn.classList.remove('border-slate-300', 'bg-white');
                } else {
                    btn.classList.remove('border-sky-500', 'bg-sky-100', 'font-bold');
                    btn.classList.add('border-slate-300', 'bg-white');
                }
            });
        }

        function submitAnswer() {
            if (selectedOption === null) {
                showToast("선지를 선택해주세요!");
                return;
            }

            const correctNum = parseInt(atob(_encAns), 10);
            const userNum = selectedOption + 1; // 1-indexed

            if (userNum === correctNum) {
                // CORRECT
                closeProblemModal();
                showSuccessModal();
            } else {
                // INCORRECT
                const card = document.getElementById('modalCard');
                card.classList.remove('shake-effect');
                void card.offsetWidth; // Trigger reflow for animation restart
                card.classList.add('shake-effect');

                // Deduct Health Heart
                lives--;
                updateHeartsDisplay();

                if (lives <= 0) {
                    showToast("틀렸습니다. 다시 생각해 보세요! (남은 기회가 얼마 없습니다!)");
                } else {
                    showToast("틀렸습니다. 다시 생각해 보세요");
                }
            }
        }

        function updateHeartsDisplay() {
            const container = document.getElementById('heartsContainer');
            const hearts = container.querySelectorAll('.heart-icon');
            hearts.forEach((h, idx) => {
                if (idx >= lives) {
                    h.classList.remove('fill-red-500');
                    h.classList.add('fill-slate-600');
                }
            });
        }

        function showSuccessModal() {
            const modal = document.getElementById('successModal');
            document.getElementById('acquiredFlowerGraphic').innerHTML = getDiamondFlowerSVG();
            document.getElementById('explanationText').innerText = _encData.explanation;
            modal.classList.remove('hidden');
        }

        function collectItemAction() {
            isCollected = true;
            
            // 1. Hide the interactive flower on the main field
            const flowerField = document.getElementById('flowerContainer');
            flowerField.style.display = 'none';

            // 2. Put item in Bag Slot 3
            const slot3 = document.getElementById('bagSlot3');
            slot3.innerHTML = `
                <div class="w-8 h-8">${getDiamondFlowerSVG()}</div>
                <span class="text-[9px] text-sky-200 mt-1">다이아 야생화</span>
            `;
            slot3.classList.remove('opacity-60');

            // 3. Update story dialogue text
            document.getElementById('dialogueText').innerText = "다이아몬드 야생화 채집 완료! 다음 관문으로 나아가십시오.";

            // 4. Update Success Modal Content & Display final destination message
            const statusText = document.getElementById('successStatusText');
            statusText.className = "text-sm text-amber-200 font-bold leading-relaxed bg-amber-950/80 p-4 rounded w-full border-2 border-amber-500";
            statusText.innerText = "“마법검을 완성하기 위해 ‘마녀의 오두막’으로 가시오.”";

            // Replace collect button with Exit Stage button
            const btnContainer = document.getElementById('actionButtonContainer');
            btnContainer.innerHTML = `
                <button onclick="leaveStageAction()" class="w-full pixel-btn py-3 text-sm font-bold bg-emerald-600 border-emerald-400 hover:bg-emerald-500">
                    [다음 장소로 이동하기] ➔
                </button>
            `;
        }

        function leaveStageAction() {
            showToast("마녀의 오두막으로 이동하는 중...");
            setTimeout(() => {
                document.getElementById('successModal').classList.add('hidden');
            }, 1000);
        }

        window.onload = function() {
            // Render canvas background
            initWaterfallCanvas();

            // Set main screen flower icon
            document.getElementById('flowerIcon').innerHTML = getDiamondFlowerSVG();

            // Populate Question Modal Content from encrypted payload
            document.getElementById('questionPrompt').innerText = _encData.prompt;
            document.getElementById('passageText').innerText = _encData.passage;

            // Options List Render
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            _encData.options.forEach((optText, index) => {
                const optBtn = document.createElement('button');
                optBtn.className = "option-btn w-full text-left p-2.5 rounded border border-slate-300 bg-white text-slate-800 text-sm transition flex items-center hover:bg-slate-50";
                optBtn.innerText = optText;
                optBtn.onclick = () => selectOption(index);
                optionsContainer.appendChild(optBtn);
            });
        };
    </script>
</body>
</html>
